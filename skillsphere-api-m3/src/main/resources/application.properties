# ===========================
# SKILLSPHERE - Configuración
# ===========================

# Nombre de la aplicación
spring.application.name=skillsphere
spring.config.import=optional:file:.env[.properties]

# ===========================
# Conexión a PostgreSQL (Supabase DB)
# ===========================
# Utilizamos la conexión JDBC directa (Puerta 2) para aprovechar JPA e Hibernate
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===========================
# Configuración de JPA / Hibernate
# ===========================
# update: actualiza el esquema de la base de datos automáticamente si hay cambios en las @Entity
spring.jpa.hibernate.ddl-auto=update
# Inicialización de SQL
spring.sql.init.mode=always
# Muestra las consultas SQL en consola (útil para debuggear)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===========================
# OpenAPI / Swagger
# ===========================
# Ruta para la documentación JSON de la API
springdoc.api-docs.path=/v3/api-docs
# Ruta para la interfaz Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Desactivar devtools restart para evitar conflictos con Lombok
spring.devtools.restart.enabled=false
